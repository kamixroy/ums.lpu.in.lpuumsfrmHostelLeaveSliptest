<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Slip Form</title>

<style>

@font-face{
  font-family:'LocalFont';
  src:url('Font.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
}
*{
  font-family:'LocalFont', sans-serif !important;
}


body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);
  color:#333;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:400px;
}

.card{
  background:#ffffff;
  padding:24px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
  border:1px solid rgba(0,0,0,0.05);
}

h2{
  margin-top:0;
  margin-bottom:24px;
  text-align:center;
  font-size:24px;
  font-weight:600;
  color:#007aff;
}

label{
  font-weight:500;
  display:block;
  margin-top:16px;
  margin-bottom:8px;
  color:#333;
  font-size:16px;
}

input,select{
  width:100%;
  padding:12px 16px;
  font-size:16px;
  border:1px solid #d1d1d6;
  border-radius:8px;
  background:#ffffff;
  box-sizing:border-box;
}

button{
  margin-top:32px;
  width:100%;
  padding:14px;
  font-size:17px;
  font-weight:600;
  background:#007aff;
  color:#ffffff;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

/* Leave ID + Leave Code row */
.rowInput{
  display:flex;
  gap:6px;
}

.rowInput input{
  flex:1;
}

.rowInput button{
  width:70px;
  margin-top:0;
  padding:12px;
  font-size:14px;
  background:#34c759;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Hostel Leave Details</h2>

<label>Name</label>
<input id="name" type="text" value="Rishav Kumar">

<label>VID</label>
<input id="vid" type="text" value="12417814">

<label>Leave ID</label>
<div class="rowInput">
<input id="leaveId" type="text" maxlength="7" pattern="\d*">
<button type="button" onclick="genLeaveId()">Gen</button>
</div>

<label>Leave Code</label>
<div class="rowInput">
<input id="leaveCode" type="text" maxlength="6" pattern="\d*">
<button type="button" onclick="genLeaveCode()">Gen</button>
</div>

<label>Select Leave Type</label>
<select id="leaveType">
<option>Day Leave</option>
<option>Night Leave</option>
<option>Day Leave(Extended Leave Timing)</option>
<option>Night Leave(Extended Leave Timing)</option>
</select>

<label>Gate Activation Status</label>
<select id="gateStatus">
<option value="Activated">Activated</option>
<option value="Processing">Processing</option>
<option value="In Process">In Process</option>
</select>

<label>Checkout (Exit) Gate 1</label>
<select id="checkoutGate1">
<option>G1</option><option selected>G2</option><option>G3</option>
<option>G4</option><option>G5</option><option>G6</option><option>G7</option>
</select>

<label>Checkout (Exit) Gate 2</label>
<select id="checkoutGate2">
<option>G1</option><option>G2</option><option selected>G3</option>
<option>G4</option><option>G5</option><option>G6</option><option>G7</option>
</select>

<label>Checkin (Entry) Gate 1</label>
<select id="checkinGate1">
<option selected>G1</option><option>G2</option><option>G3</option>
<option>G4</option><option>G5</option><option>G6</option><option>G7</option>
</select>

<label>Checkin (Entry) Gate 2</label>
<select id="checkinGate2">
<option>G1</option><option selected>G2</option><option>G3</option>
<option>G4</option><option>G5</option><option>G6</option><option>G7</option>
</select>


<label>Date of Apply</label>
<input type="datetime-local" id="apply">

<label>Date of Leaving</label>
<input type="datetime-local" id="leaving">

<label>Date of Return</label>
<input type="datetime-local" id="returning">

<label>Checkout Time</label>
<input type="datetime-local" id="checkout">

<button onclick="submitForm()">Generate Slip</button>

</div>
</div>

<script>

/* Generate 7 digit Leave ID */
function genLeaveId(){
let num=Math.floor(1000000+Math.random()*9000000);
document.getElementById("leaveId").value=num;
}

/* Generate 6 digit Leave Code */
function genLeaveCode(){
let num=Math.floor(100000+Math.random()*900000);
document.getElementById("leaveCode").value=num;
}

/* Submit Form */
function submitForm(){

const params=new URLSearchParams({

name:document.getElementById("name").value,
vid:document.getElementById("vid").value,
leaveId:document.getElementById("leaveId").value,
leaveCode:document.getElementById("leaveCode").value,
leaveType:document.getElementById("leaveType").value,
gateStatus:document.getElementById("gateStatus").value,
checkoutGate1:document.getElementById("checkoutGate1").value,
checkoutGate2:document.getElementById("checkoutGate2").value,
checkinGate1:document.getElementById("checkinGate1").value,
checkinGate2:document.getElementById("checkinGate2").value,

apply:document.getElementById("apply").value,
leaving:document.getElementById("leaving").value,
returning:document.getElementById("returning").value,
checkout:document.getElementById("checkout").value

});

window.location.href="slip.html?"+params.toString();

}

</script>

</body>
</html>
